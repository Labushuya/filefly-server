<?xml version="1.0" encoding="UTF-8"?>
<!-- FileFly SERVER banner — same mark, clearly labelled as the server component. 1280×360. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="FileFly Server">
  <defs>
    <radialGradient id="sg-glow" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#FFE9A3"/><stop offset="40%" stop-color="#FFC534"/>
      <stop offset="78%" stop-color="#FF8A1E"/><stop offset="100%" stop-color="#F26800"/>
    </radialGradient>
    <linearGradient id="sg-wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD873"/><stop offset="100%" stop-color="#FF8A1E"/>
    </linearGradient>
    <linearGradient id="sg-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC534"/><stop offset="100%" stop-color="#FF8A1E"/>
    </linearGradient>
    <linearGradient id="sg-word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9A3"/><stop offset="100%" stop-color="#FFB020"/>
    </linearGradient>
    <filter id="sg-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="sg-wl"><path d="M250 172 C 206 132, 132 96, 92 128 C 60 154, 74 208, 128 232 C 176 252, 224 224, 250 200 Z"/></clipPath>
    <clipPath id="sg-wr"><path d="M262 172 C 306 132, 380 96, 420 128 C 452 154, 438 208, 384 232 C 336 252, 288 224, 262 200 Z"/></clipPath>
  </defs>

  <rect width="1280" height="360" fill="#0B0B0D"/>

  <!-- ===== LOGO MARK ===== -->
  <g transform="translate(40,-76) scale(0.86)">
    <circle cx="256" cy="256" r="248" fill="#0B0B0D"/>
    <circle cx="256" cy="256" r="228" fill="none" stroke="url(#sg-ring)" stroke-width="10"
            stroke-linecap="round" stroke-dasharray="470 90 300 90" transform="rotate(-32 256 256)"/>
    <circle cx="256" cy="286" r="88" fill="url(#sg-glow)" opacity="0.65" filter="url(#sg-blur)"/>
    <g>
      <path d="M250 172 C 206 132, 132 96, 92 128 C 60 154, 74 208, 128 232 C 176 252, 224 224, 250 200 Z" fill="url(#sg-wing)" stroke="url(#sg-ring)" stroke-width="6"/>
      <g clip-path="url(#sg-wl)"><circle cx="140" cy="150" r="14" fill="#FFF3CE"/>
        <path d="M96 224 L150 176 L188 210 L224 182 L250 210 L250 240 L96 240 Z" fill="#B85200" opacity="0.85"/></g>
    </g>
    <g>
      <path d="M262 172 C 306 132, 380 96, 420 128 C 452 154, 438 208, 384 232 C 336 252, 288 224, 262 200 Z" fill="url(#sg-wing)" stroke="url(#sg-ring)" stroke-width="6"/>
      <g clip-path="url(#sg-wr)"><path d="M330 150 l40 26 l-40 26 z" fill="#B85200"/></g>
    </g>
    <ellipse cx="256" cy="158" rx="22" ry="26" fill="#1B1B1F" stroke="url(#sg-ring)" stroke-width="6"/>
    <path d="M246 138 C 236 116, 220 110, 206 114" fill="none" stroke="url(#sg-ring)" stroke-width="6" stroke-linecap="round"/>
    <path d="M266 138 C 276 116, 292 110, 306 114" fill="none" stroke="url(#sg-ring)" stroke-width="6" stroke-linecap="round"/>
    <g filter="url(#sg-blur)" opacity="0.9"><ellipse cx="256" cy="286" rx="34" ry="72" fill="url(#sg-glow)"/></g>
    <ellipse cx="256" cy="286" rx="30" ry="68" fill="url(#sg-glow)" stroke="#F26800" stroke-width="4"/>
    <circle cx="256" cy="372" r="7" fill="#FFE9A3"/>
  </g>

  <!-- ===== WORDMARK with SERVER badge ===== -->
  <text x="470" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="112" font-weight="800" fill="url(#sg-word)" letter-spacing="1">FileFly</text>
  <!-- SERVER pill -->
  <g transform="translate(474,214)">
    <rect x="0" y="0" width="196" height="46" rx="23" fill="none" stroke="url(#sg-ring)" stroke-width="3"/>
    <text x="98" y="32" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFC534" letter-spacing="6">SERVER</text>
  </g>
  <text x="690" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="500" fill="#C9C9CE" letter-spacing="0.5">self-hosted upload backend</text>
</svg>
